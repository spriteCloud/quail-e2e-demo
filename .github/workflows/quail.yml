name: quail
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  quail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Connect to Netbird
        # SHA-pinned (not @main) so a malicious push to this third-party
        # action repo can't pivot into the runner.
        uses: Alemiz112/netbird-connect@b2bea073dea42968276f717128c57e739dd514f3
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          # Self-hosted Netbird management plane; defaults to api.netbird.io
          # in the action so we MUST pass it explicitly.
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          hostname: gh-quail-${{ github.run_id }}

      - name: Reach DGX through Netbird (with WireGuard handshake wait)
        # `netbird up` returning "Connected" only means the management
        # plane handshake finished — the actual peer-to-peer WireGuard
        # tunnels are established lazily. Retry the DGX endpoint for up
        # to 60s; on the way out, dump the peer state so failures are
        # diagnosable from the log alone.
        run: |
          set -u
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://100.82.34.115:11434/api/version >/dev/null 2>&1; then
              echo "DGX reachable after ${i} attempt(s)."
              curl -fsS http://100.82.34.115:11434/api/version
              exit 0
            fi
            echo "attempt ${i}/30: DGX not yet reachable; sleeping 2s"
            sleep 2
          done
          echo "::error::DGX unreachable after 60s of WireGuard waits."
          echo "--- netbird status --detail ---"
          sudo netbird status --detail || true
          exit 1

      # Run the @smoke subset of the existing suite BEFORE quail. One
      # spec (tests/e2e/heal-demo/broken-locator.spec.ts) is
      # deliberately broken so heal has something to fix; everything
      # else either passes or is skipped. The resulting
      # playwright-report.json is what the quail action's heal-mode
      # consumes to open a follow-up "quail: heal ..." PR.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install demo deps + Playwright browsers
        # No package-lock.json in the repo (the demo regenerates the
        # package.json via the bot PR); use `npm install` instead of
        # `npm ci`. Browsers are cached by setup-node + actions cache
        # automatically.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run @smoke subset (failures expected — feeds quail heal)
        # `--reporter=json` writes to stdout by default. PLAYWRIGHT_JSON_OUTPUT_NAME
        # redirects it to a file the quail heal step then consumes.
        # `|| true` keeps the workflow going so the heal step actually runs.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: npx playwright test --grep @smoke --reporter=json || true

      - uses: spriteCloud/quail@v1
        with:
          pr: ${{ github.event.pull_request.number }}
          # Pin to v0.96.0 — adds probe-state cache, LLM startup ping,
          # and serve-UI step-def regen. Clients running locally see
          # exactly the same binary.
          version: v0.96.0
          # Probe fallback. When the PR diff yields no recognised new
          # symbols, `quail generate` still probes this URL so the
          # bot PR contains a fresh full suite. Required for this
          # demo since Subscribe.ts is a class export that the TS
          # AST extractor doesn't flag as a journey-bearing symbol.
          target-urls: https://www.spritecloud.com
          openai-base-url: http://100.82.34.115:11434/v1
          openai-api-key: ollama
          model: qwen3-coder-next:latest
          heal-mode: on-failure
          playwright-report: playwright-report.json
          log-level: info
