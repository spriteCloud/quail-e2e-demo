name: quail-explore

# Ephemeral change-aware adversarial exploration of the demo target.
#
# Runs on every PR: the `quail explore` command generates a Playwright
# suite into a temp dir, executes it once, and prints a Gherkin-formatted
# report to this step's stdout. The composite action then wraps that
# report in a spriteCloud-branded HTML page and uploads it as the
# `quail-explore-report` artifact, so reviewers can open the HTML from
# the run summary without cloning anything.
#
# Wiring notes:
#   - `fetch-depth: 2` lets `git diff HEAD~1..HEAD` work when the PR's
#     change context can't be resolved via GITHUB_EVENT_PATH.
#   - `version: source` builds quail from `spriteCloud/quail-review@<ref>`
#     because the `explore` command is still on `feat/explore`. Flip
#     back to `version: latest` (or drop the input) once the feature is
#     released. See the ponytail note in the action's install step.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Reach DGX for the adversarial attack-plan composer. Explore
      # calls the LLM per requested category and validates every
      # response against the guardrails spec.
      - name: Connect to Netbird
        uses: Alemiz112/netbird-connect@b2bea073dea42968276f717128c57e739dd514f3
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          hostname: gh-quail-explore-${{ github.run_id }}
      - name: Reach DGX through Netbird
        run: |
          set -u
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://100.82.34.115:11434/api/version >/dev/null 2>&1; then
              echo "DGX reachable after ${i} attempt(s)." && exit 0
            fi
            sleep 2
          done
          echo "::warning::DGX unreachable after 60s — explore will fall back to the stamped template."

      - name: Adversarial explore against the demo target
        uses: spriteCloud/quail-review@feat/explore
        with:
          version: source

          # Cross-repo PAT so the composite action's source-build path
          # can clone the private quail-core repo. This whole block
          # (github-token + version: source) evaporates once quail-core
          # cuts a release with the Explorer contract — at that point
          # this workflow becomes `uses: spriteCloud/quail-review@v1`
          # with no explicit token and no version override.
          github-token: ${{ secrets.QUAIL_PAT }}

          # Skip generate/heal — this workflow is explore-only.
          run-generate: 'false'
          run-heal: 'false'

          # Change-aware context for the LLM prioritisation hints.
          pr: ${{ github.event.number }}

          # LLM endpoint for the attack-plan composer. Same DGX-hosted
          # qwen3-coder-next the generate/heal jobs use. Without this,
          # explore falls back to the honest "not exercised" stamped
          # template.
          explore-llm: http://100.82.34.115:11434/v1
          openai-base-url: http://100.82.34.115:11434/v1
          openai-api-key: ollama
          model: qwen3-coder-next:latest

          # Explore surface. the-internet.herokuapp.com is the industry-
          # standard Playwright-demo target: deterministic forms, no
          # cookie wall, dozens of testable interactions across pages.
          # Perfect for showing the full compose→execute→report pipeline
          # end-to-end. Real-world sites (ING, banks, EU commerce) have
          # cookie walls and WAF fingerprints — that's what the probe +
          # executor i18n/vendor dismisser handles per-navigation now.
          explore-url: https://the-internet.herokuapp.com/login
          explore-focus: boundary,data-edge,injection,state-corrupt,auth
          # standard depth crawls a handful of subpages so the LLM sees
          # /login, /inputs, /forgot_password etc. in KNOWN PAGES and
          # picks the form-bearing one per category.
          explore-depth: standard
          # Timeboxed exploratory session — the LLM loops (feeding
          # forward already-tried selectors) until this expires or two
          # consecutive rounds produce nothing new. 120s covers the
          # multi-page crawl + per-page execution comfortably.
          explore-timebox: 120s
