name: quail
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write

jobs:
  # smoke — Run the @smoke subset, capture the JSON report, then gate
  # via `quail ledger verify`. The Playwright step still tolerates
  # failures (its job is to harvest the report) but the verify step
  # is the real pass/fail: it exits non-zero ONLY when the report
  # contains a failure NOT tracked as open in tests/e2e/docs/findings.md.
  # Known SUT debt stays in the ledger; regressions surface red.
  # Heal consumes the same artifact regardless.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install demo deps + Playwright browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install quail (for ledger verify)
        run: |
          set -euo pipefail
          ver=v1.0.40
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/spriteCloud/quail-review/releases/download/${ver}/quail-review_linux_amd64.tar.gz" -o "$tmp/q.tar.gz"
          tar -xzf "$tmp/q.tar.gz" -C "$tmp"
          sudo mv "$tmp/quail-review" /usr/local/bin/quail-review
          # v1.0.0 — keep `run: quail …` shorthand alive via symlink.
          sudo ln -sf /usr/local/bin/quail-review /usr/local/bin/quail
          quail --version
      - name: Run @smoke subset
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json }
        run: npx playwright test --grep @smoke --reporter=json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report.json
          retention-days: 7
      - name: Verify smoke against findings.md baseline
        run: quail ledger verify --report=playwright-report.json --baseline=tests/e2e/docs/findings.md

  # generate — Probe the target site + emit a fresh test suite as a
  # follow-up "quail: tests for PR #N" PR. Strictly no heal here; the
  # heal job below handles failures.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Connect to Netbird
        uses: Alemiz112/netbird-connect@b2bea073dea42968276f717128c57e739dd514f3
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          hostname: gh-quail-gen-${{ github.run_id }}
      - name: Reach DGX through Netbird
        run: |
          set -u
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://100.82.34.115:11434/api/version >/dev/null 2>&1; then
              echo "DGX reachable after ${i} attempt(s)." && exit 0
            fi
            sleep 2
          done
          echo "::error::DGX unreachable after 60s." && exit 1

      - uses: spriteCloud/quail-review@v1
        env:
          QUAIL_KINDS: journey
        with:
          pr: ${{ github.event.pull_request.number }}
          version: v1.0.40
          run-generate: 'true'
          run-heal: 'false'
          target-urls: https://www.spritecloud.com
          openai-base-url: http://100.82.34.115:11434/v1
          openai-api-key: ollama
          model: qwen3-coder-next:latest
          log-level: info

  # heal — Read smoke's report. If failures exist, open a "quail: heal
  # locators for PR #N" PR with better-anchored replacements. No probe,
  # no generate; this job is single-purpose.
  heal:
    needs: smoke
    # Heal should run whether or not `Verify smoke against findings.md`
    # passed — the ledger-verify gate is a human-facing UX check for
    # regressions, but heal's job is to propose locator fixes from the
    # Playwright JSON report regardless of ledger drift. Without this,
    # any untracked regression on the branch (e.g. a stale snapshot)
    # skips heal entirely, which is exactly the situation heal exists
    # to help with.
    if: ${{ !cancelled() && needs.smoke.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Connect to Netbird
        uses: Alemiz112/netbird-connect@b2bea073dea42968276f717128c57e739dd514f3
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          hostname: gh-quail-heal-${{ github.run_id }}
      - name: Reach DGX through Netbird
        run: |
          set -u
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://100.82.34.115:11434/api/version >/dev/null 2>&1; then
              echo "DGX reachable after ${i} attempt(s)." && exit 0
            fi
            sleep 2
          done
          echo "::error::DGX unreachable after 60s." && exit 1

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: .
      - uses: spriteCloud/quail-review@v1
        with:
          pr: ${{ github.event.pull_request.number }}
          version: v1.0.40
          run-generate: 'false'
          run-heal: 'true'
          heal-mode: 'proactive'
          playwright-report: playwright-report.json
          openai-base-url: http://100.82.34.115:11434/v1
          openai-api-key: ollama
          model: qwen3-coder-next:latest
          log-level: info

  # verify — Run the generated tests on the bot's follow-up PR branch.
  # The new .feature files emitted by v0.97.0 are tagged @smoke, so
  # `--grep @smoke` covers them. Comments the result back on the bot
  # PR and fails this job (red check on the original PR) when any
  # generated test fails.
  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.user.login != 'quail-bot'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Find quail bot PR for this run
        id: find
        env:
          GH_TOKEN: ${{ secrets.QUAIL_BOT_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          SHORT="${HEAD_SHA:0:7}"
          BRANCH="quail/tests-pr-${PR_NUM}-${SHORT}"
          echo "Looking for bot PR on branch $BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -z "$PR" ]; then
            echo "::notice::No quail bot PR on $BRANCH yet; nothing to verify."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Checkout bot PR branch
        if: steps.find.outputs.skip != 'true'
        run: |
          git fetch origin "${{ steps.find.outputs.branch }}"
          git checkout "${{ steps.find.outputs.branch }}"
      - name: Install demo deps + Playwright browsers
        if: steps.find.outputs.skip != 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run generated @smoke tests
        if: steps.find.outputs.skip != 'true'
        id: run
        run: npx playwright test --grep @smoke --reporter=line
      - name: Comment success on bot PR
        if: steps.find.outputs.skip != 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.QUAIL_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: 'gh pr comment ${{ steps.find.outputs.pr }} --body "quail verify - generated @smoke tests pass against the bot PR branch."'
      - name: Comment failure on bot PR
        if: steps.find.outputs.skip != 'true' && failure()
        env:
          GH_TOKEN: ${{ secrets.QUAIL_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: 'gh pr comment ${{ steps.find.outputs.pr }} --body "quail verify - generated @smoke tests FAILED. See [job logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."'
