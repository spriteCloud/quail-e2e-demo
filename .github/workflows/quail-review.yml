name: quail-review

# Fires when someone comments `@quail` on a PR. quail-review fetches
# the PR's unified diff, asks the LLM for a `## Core Changes` +
# `## Verdict` summary, and posts the result as a single markdown
# comment on the PR.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@quail')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Connect to Netbird
        uses: Alemiz112/netbird-connect@b2bea073dea42968276f717128c57e739dd514f3
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          hostname: gh-quail-review-${{ github.run_id }}
      - name: Reach DGX through Netbird
        run: |
          set -u
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://100.82.34.115:11434/api/version >/dev/null 2>&1; then
              echo "DGX reachable after ${i} attempt(s)." && exit 0
            fi
            sleep 2
          done
          echo "::error::DGX unreachable after 60s." && exit 1

      - uses: spriteCloud/quail-review@v1
        with:
          version: v1.0.15
          mode: review
          pr: ${{ github.event.issue.number }}
          openai-base-url: http://100.82.34.115:11434/v1
          openai-api-key: ollama
          model: qwen3-coder-next:latest
          log-level: info
